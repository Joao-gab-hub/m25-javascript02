<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <title>Sistema de Clinica - login</title>
</head>

<body>
    <div id="quadro-login">
        <img src="img-login.png" alt="imagem de login">
        <!-- Conjunto para e-mail -->
        <div class="form-imput">
                <label for="email">Informe seu E-mail</label>
                <imput type="text" name="email" id="email" placeholder="eamil@exemplo.com.br">
        </div>
        <!-- Conjunto para senha -->
        <div class="form-imput">
                <label for="senha">Informe sua senha</label>
                <imput type="text" name="senha" id="senha" placeholder="Informe sua senha">
        </div>
        <!-- Conjunto esqueceu a senha -->
        <div id="quadro-links">
            <div>
            <label for="manter_logado">Manter-se logado</label>
            <input type="checkbox" name="manter_logado" id="manter_logado">
        </div>
        <div>
            <a href="#">Esqueceu a Senha?</a>
        </div>
    </div>
    <!-- conjunto para botôes -->
     <div id="quadro-botões">
        <button class="bnt-login">login</button>
     </div>
</body>

</html>
